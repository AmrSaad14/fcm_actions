name: fcm_actions
description: Production-ready FCM actions, tokens, topics, and routing for Flutter on Android, iOS, macOS, and web.
version: 1.0.0
homepage: https://github.com/AmrSaad14/fcm_actions
repository: https://github.com/AmrSaad14/fcm_actions
issue_tracker: https://github.com/AmrSaad14/fcm_actions/issues
topics:
  - firebase
  - notifications
  - fcm
  - actions
  - messaging
platforms:
  android:
  ios:
  macos:
  web:

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.7
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: ^1.17.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ">=3.2.5 <5.0.0"
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

