name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate immutable models
        run: dart run build_runner build

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test example/lib example/test

      - name: Analyze
        run: flutter analyze

      - name: Test package
        run: flutter test --coverage

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Check publication archive
        run: flutter pub publish --dry-run
